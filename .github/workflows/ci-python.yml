name: ci-python

# The obsview app's tests, type check and coverage, through the shared
# python.yml (the same call health makes), run from app/ where its
# pyproject.toml and uv.lock live. Not yet a required check: it becomes one
# in github-repos once it has reported reliably.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    uses: jay-withers/workflows/.github/workflows/python.yml@7e124ba6227a9efebd37b0fff487bad8a1d83975 # v1.31.5
    with:
      working-directory: app
      # The runtime image's Python (dev-containers python-app), not the latest.
      python-version: "3.14"
      extras: dev
      coverage: obsview
      coverage-pr-comment: true
      diff-coverage: "80"
      typecheck: mypy
